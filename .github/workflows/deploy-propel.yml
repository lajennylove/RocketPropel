name: Deploy Propel docs

# Deploys propel.rocketboost.rs. The server pulls origin/main and rebuilds, so a
# change to the docs app or to the Rocket checkout it builds against ships here.
# The Propel library is pinned by rev in examples/propel/Cargo.toml: bump that rev
# to ship library changes.

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "examples/Cargo.toml"
      - "examples/propel/**"
      - ".github/workflows/deploy-propel.yml"
  workflow_dispatch:

concurrency:
  group: deploy-propel
  cancel-in-progress: false

jobs:
  deploy:
    name: propel.rocketboost.rs
    runs-on: ubuntu-latest
    steps:
      - name: Install deploy key and host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_propel
          chmod 600 ~/.ssh/deploy_propel
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run the deploy script on the server
        # The server's forced command runs /usr/local/bin/deploy-propel, so the
        # command given here is ignored.
        run: ssh -i ~/.ssh/deploy_propel -o IdentitiesOnly=yes -o BatchMode=yes deploy@178.156.156.18
