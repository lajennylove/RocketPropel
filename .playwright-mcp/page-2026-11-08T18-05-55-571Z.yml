    - generic [ref=f27e10]:
      - heading "Missing variable" [level=1] [ref=f27e11]
      - paragraph [ref=f27e12]: "A template can use a variable that the handler did not provide. When that happens, Propel stops rendering the page and returns an error. Propel is strict on purpose: a name that is missing from the context is a bug, and it should not quietly print nothing."
      - heading "What causes it" [level=2] [ref=f27e13]
      - paragraph [ref=f27e14]:
        - text: The view below uses
        - code [ref=f27e15]: $not_in_context
        - text: ", but the context it is rendered with has no field of that name."
      - code [ref=f27e17]:
        - generic [ref=f27e18]: "{{ $not_in_context }}"
      - heading "The context it is rendered with" [level=2] [ref=f27e19]
      - paragraph [ref=f27e20]: "Each view has a Rust struct that holds its data. The handler builds it, and this one has no fields:"
      - code [ref=f27e22]: "#[derive(Serialize)] pub struct NoFields {}"
      - paragraph [ref=f27e23]: "The handler passes it to the view. This is the route for this page:"
      - code [ref=f27e25]: "PropelView::render(\"errors.missing\", &Page::new(\"/errors/missing\", Article { title: \"Missing variable\".into(), }))"
      - heading "What you see" [level=2] [ref=f27e26]
      - paragraph [ref=f27e27]: "In a development build, the page shows an error page with the message and a hint. The message names the variable and the view:"
      - code [ref=f27e29]: "undefined variable `not_in_context` in `errors.missing`"
      - figure "The debug page for this error, as it appears in a development build." [ref=f27e30]:
        - img "The debug error page for a missing variable, with the message undefined variable not_in_context" [ref=f27e31]
      - paragraph [ref=f27e33]: In a release build, the browser sees only a generic error, and the details go to the log.
      - heading "How to fix it" [level=2] [ref=f27e34]
      - paragraph [ref=f27e35]: "There are two ways. Add the field to the context and fill it in the handler, or correct the name in the view. Here is the first:"
      - code [ref=f27e37]: "#[derive(Serialize)] pub struct Greeting { pub not_in_context: String, }"
      - code [ref=f27e39]: "PropelView::render(\"errors.missing\", &Greeting { not_in_context: \"Hello\".into(), })"
      - heading "Missing values that are allowed" [level=2] [ref=f27e40]
      - paragraph [ref=f27e41]:
        - text: A field that exists but is empty is not an error. A
        - code [ref=f27e42]: "null"
        - text: value prints nothing, and a nested field of a
        - code [ref=f27e43]: "null"
        - text: value is empty too. See
        - link "control flow" [ref=f27e44] [cursor=pointer]:
          - /url: /features/control
        - text: .
