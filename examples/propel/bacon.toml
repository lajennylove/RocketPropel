# Rebuild and restart on every change to Rust code. View edits are read from
# disk on each request, so they do not need a restart.
# Run `bacon` from this directory.
default_job = "run"

[jobs.run]
command = ["cargo", "run", "--color", "always"]
need_stdout = true
background = true
on_change_strategy = "kill_then_restart"
watch = ["src"]
